<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Walking Meditation — phone preview</title>
    <style>
      /* Dev-only page: renders the app inside a phone bezel for demos on a laptop. */
      :root {
        --screen-w: 390px;
        --screen-h: 844px;
        --bezel: 14px;
      }
      html { height: 100%; }
      body {
        min-height: 100%;
        margin: 0;
        padding: 24px 16px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 40px;
        background: radial-gradient(circle at 30% 20%, #2a3550, #0f1320 70%);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #c9d1e3;
      }
      .phone {
        position: relative;
        width: calc(var(--screen-w) + var(--bezel) * 2);
        height: calc(var(--screen-h) + var(--bezel) * 2);
        padding: var(--bezel);
        border-radius: 58px;
        background: #0b0d12;
        box-shadow:
          0 0 0 2px #2b2f3a,
          0 0 0 6px #14171e,
          0 30px 80px rgba(0, 0, 0, 0.6);
        flex: none;
      }
      /* side buttons */
      .phone::before, .phone::after {
        content: "";
        position: absolute;
        background: #1c2029;
        border-radius: 3px;
      }
      .phone::before { left: -8px; top: 150px; width: 4px; height: 110px; }
      .phone::after  { right: -8px; top: 200px; width: 4px; height: 80px; }
      .screen {
        position: relative;
        width: var(--screen-w);
        height: var(--screen-h);
        border-radius: 46px;
        overflow: hidden;
        background: #f5f5f7;
      }
      .island {
        position: absolute;
        top: 11px;
        left: 50%;
        transform: translateX(-50%);
        width: 120px;
        height: 34px;
        border-radius: 20px;
        background: #0b0d12;
        z-index: 2;
      }
      .clock {
        position: absolute;
        top: 18px;
        left: 34px;
        font-size: 15px;
        font-weight: 600;
        color: #16181d;
        z-index: 2;
      }
      .status {
        position: absolute;
        top: 18px;
        right: 30px;
        font-size: 13px;
        color: #16181d;
        z-index: 2;
      }
      iframe {
        border: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .home-bar {
        position: absolute;
        bottom: 8px;
        left: 50%;
        transform: translateX(-50%);
        width: 134px;
        height: 5px;
        border-radius: 3px;
        background: #16181d;
        opacity: 0.85;
        z-index: 2;
      }
      aside { max-width: 260px; font-size: 14px; line-height: 1.5; }
      aside h1 { font-size: 18px; margin: 0 0 8px; color: #fff; }
      aside code { background: #1c2029; padding: 1px 5px; border-radius: 4px; }
      @media (max-width: 760px) { aside { display: none; } body { gap: 0; } .phone { transform: scale(0.9); } }
    </style>
  </head>
  <body>
    <div class="phone">
      <div class="screen">
        <div class="island"></div>
        <div class="clock" id="clock">9:41</div>
        <div class="status">●●● ▲ ▮</div>
        <iframe id="app" src="/" title="Walking Meditation app"></iframe>
        <div class="home-bar"></div>
      </div>
    </div>
    <aside>
      <h1>Phone preview</h1>
      <p>The app running inside a 390×844 frame (iPhone 14/15 size). Interact with it normally.</p>
      <p>This page is for demos only; it isn't linked from the app. Open <code>/phone.html</code> on any deployment to use it.</p>
    </aside>
    <script>
      function tick() {
        const d = new Date();
        document.getElementById('clock').textContent =
          (d.getHours() % 12 || 12) + ':' + String(d.getMinutes()).padStart(2, '0');
      }
      // Simple clock; keep the classic 9:41 if you prefer by removing this.
      setInterval(tick, 30000); tick();

      // Tell the app (same origin) to leave room for the fake status bar.
      const frame = document.getElementById('app');
      frame.addEventListener('load', () => {
        try {
          frame.contentDocument.documentElement.style.setProperty('--safe-top', '54px');
        } catch (e) { /* cross-origin: ignore */ }
      });
    </script>
  </body>
</html>
