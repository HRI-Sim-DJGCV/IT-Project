# Continuous integration: runs on every pull request and on every push to main.
#
#   backend     typecheck, unit + HTTP tests (vitest + supertest), compile
#   frontend    lint (oxlint), typecheck + component tests (vitest + jsdom), production build
#   ai-service  Python syntax check of server/ (the full dependency set is ~GBs, so no pip install)
#   docker      builds the api and web images exactly as docker compose does, without pushing
#
# Deployment is not done here: the frontend is deployed by Vercel's GitHub
# integration (see README "Deploying"), and the API + AI service are run from
# the Docker images on a host of the team's choosing.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API (backend/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check the AI stub still parses
        working-directory: .
        run: node --check tools/ai-stub/stub.mjs

  frontend:
    name: Web app (frontend/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # "build" runs tsc -b first, so this is also the typecheck.
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://api.example.invalid/v1

  ai-service:
    name: AI service (server/) syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m compileall -q server

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
