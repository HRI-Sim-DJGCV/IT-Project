# Deploys the backend to the EC2 instance after a pull request is merged.
#
# Runs when the CI workflow finishes successfully on main (so a merge that
# breaks the tests is never deployed), or by hand from the Actions tab.
# GitHub has no SSH access to the instance: the job asks AWS Systems Manager
# to run the update on it, the same steps as "Updating" in deploy/README.md,
# pinned to the exact commit CI tested. If nothing under backend/, shared/,
# deploy/ or tools/ai-stub/ changed since the last deploy, the rebuild is skipped.
#
# Setup (once): GitHub signs in to AWS with OIDC, so no AWS keys are stored here.
#   1. Create the IAM role described in deploy/README.md ("Automatic deploys").
#   2. Add its ARN to this repo as a secret named AWS_DEPLOY_ROLE_ARN
#      Settings -> Secrets and variables -> Actions -> New repository secret
# Until the secret exists the job skips with a warning instead of failing.
name: Deploy backend

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets the job request an OIDC token for AWS

# One deploy at a time; a newer merge waits for the running one to finish.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2
  INSTANCE_ID: i-085e917feb2ee6886
  API_HEALTH_URL: https://32-236-180-226.sslip.io/v1/health

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    # Only push events on main: workflow_run also fires for CI runs on pull
    # requests whose head branch happens to be called main (e.g. from forks).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    timeout-minutes: 20
    steps:
      - name: Check the deploy role is configured
        id: precheck
        env:
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::warning::AWS_DEPLOY_ROLE_ARN secret is not set - skipping deploy (see deploy/README.md)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.precheck.outputs.enabled == 'true'
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # The instance is stopped between sessions to save credits; that's not a failure.
      - name: Check the instance is running
        id: instance
        if: steps.precheck.outputs.enabled == 'true'
        run: |
          state=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' --output text)
          echo "Instance state: $state"
          if [ "$state" != "running" ]; then
            echo "::warning::Instance $INSTANCE_ID is $state - skipping deploy. Start it and re-run this workflow."
            echo "running=false" >> "$GITHUB_OUTPUT"
          else
            echo "running=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update and rebuild on the instance
        if: steps.instance.outputs.running == 'true'
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Runs as root on the instance via SSM, with SHA set first.
          REMOTE_SCRIPT: |
            set -euo pipefail
            cd /opt/walking-meditation/app
            git fetch --quiet origin main
            before=$(git rev-parse HEAD)
            git reset --quiet --hard "$SHA"
            echo "Deploying $before -> $SHA"
            if [ "$before" != "$SHA" ] && git diff --quiet "$before" "$SHA" -- backend shared deploy tools/ai-stub; then
              echo "No backend changes since the last deploy - skipping rebuild."
              exit 0
            fi
            docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build --remove-orphans
            docker image prune -f > /dev/null
            docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env ps
        run: |
          set -euo pipefail

          # SHA is a commit hash from GitHub, so it is safe to splice in.
          script="SHA=$SHA"$'\n'"$REMOTE_SCRIPT"

          params=$(jq -n --arg s "$script" '{commands: [$s], executionTimeout: ["900"]}')
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "GitHub deploy ${SHA:0:7}" \
            --parameters "$params" \
            --query 'Command.CommandId' --output text)
          echo "SSM command: $command_id"

          # "aws ssm wait" gives up after ~100s, which a rebuild can exceed.
          status=Pending
          for _ in $(seq 1 180); do
            sleep 5
            status=$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done

          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text || true
          echo "Status: $status"
          [ "$status" = Success ]

      - name: Health check
        if: steps.instance.outputs.running == 'true'
        run: |
          for _ in $(seq 1 12); do
            if curl --silent --show-error --fail --max-time 10 "$API_HEALTH_URL"; then
              echo; echo "API is healthy."
              exit 0
            fi
            sleep 5
          done
          echo "::error::$API_HEALTH_URL did not respond after the deploy."
          exit 1
