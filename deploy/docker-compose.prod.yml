# Production backend on the EC2 instance (see deploy/README.md).
#
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
#
# Caddy terminates HTTPS for ${API_HOST} and proxies to the API. MongoDB is on
# Atlas. The AI service (./server) calls Gemini for scripts and Google Cloud
# Text-to-Speech for audio; its keys come from deploy/.env.

services:
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_HOST: ${API_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      AI_SERVICE_URL: http://ai:8001
      AUDIO_DIR: /repo/backend/data/audio
    expose:
      - "8000"
    volumes:
      - audio:/repo/backend/data/audio
    depends_on:
      - ai

  # Only the API can reach it (no published ports). It gets just the keys it
  # needs rather than the whole .env, so it never sees the database or JWT secrets.
  ai:
    build: ../server
    restart: unless-stopped
    environment:
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GOOGLE_TTS_API_KEY: ${GOOGLE_TTS_API_KEY:-}
      INTERNAL_KEY: ${INTERNAL_KEY}
    expose:
      - "8001"

volumes:
  caddy-data:
  caddy-config:
  audio:
