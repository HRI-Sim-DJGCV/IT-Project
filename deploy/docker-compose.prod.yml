# Production backend on the EC2 instance (see deploy/README.md).
#
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
#
# Caddy terminates HTTPS for ${API_HOST} and proxies to the API. MongoDB is on
# Atlas. The AI service is the stub for now; see deploy/README.md to swap in the
# real one (./server) once the Gemini and Google Cloud TTS keys are set.

services:
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_HOST: ${API_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      AI_SERVICE_URL: http://ai-stub:8001
      AUDIO_DIR: /repo/backend/data/audio
    expose:
      - "8000"
    volumes:
      - audio:/repo/backend/data/audio
    depends_on:
      - ai-stub

  ai-stub:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    command: ["node", "stub.mjs"]
    volumes:
      - ../tools/ai-stub:/app:ro

volumes:
  caddy-data:
  caddy-config:
  audio:
